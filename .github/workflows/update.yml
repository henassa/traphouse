name: Mise à jour

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Rien n'est enregistré dans le dépôt : les données vivent seulement sur le site publié.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # Relit les données du site en ligne, les met à jour, les écrit dans data/ (non suivi par git).
      # Si ça échoue, rien n'est publié : le site garde sa version précédente.
      - name: Récupérer les données
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch.mjs

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
